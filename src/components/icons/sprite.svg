<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM16 4h4v16h-4z"/><path d="M9 9h6M9 15h6"/></symbol>
  <!-- 01 Concepto: corchetes + rejilla 2x2 (a_ij) -->
  <symbol id="i-matrix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 4H6v16h2M16 4h2v16h-2"/><circle cx="10.6" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="13.4" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="10.6" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="13.4" cy="14" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <!-- 02 Tipos: barra fila + barra columna + cuadrada 2x2 -->
