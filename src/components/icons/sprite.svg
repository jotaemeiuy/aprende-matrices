  <!-- 03 Triangular superior 3x3 -->
  <symbol id="i-triangular" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 4H6v16h2M16 4h2v16h-2"/><circle cx="10.4" cy="9.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="12.6" cy="9.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.8" cy="9.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="12.6" cy="12.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.8" cy="12.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.8" cy="15.4" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <!-- 04 Traza: solo diagonal -->
  <symbol id="i-traza" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 4H6v16h2M16 4h2v16h-2"/><circle cx="10.4" cy="9.4" r="1.2" fill="currentColor" stroke="none"/><circle cx="12.6" cy="12.4" r="1.2" fill="currentColor" stroke="none"/><circle cx="14.8" cy="15.4" r="1.2" fill="currentColor" stroke="none"/><circle cx="14.8" cy="9.4" r="0.9"/><circle cx="10.4" cy="15.4" r="0.9"/><circle cx="10.4" cy="12.4" r="0.9"/><circle cx="14.8" cy="12.4" r="0.9"/><circle cx="12.6" cy="9.4" r="0.9"/><circle cx="12.6" cy="15.4" r="0.9"/></symbol>
  <!-- 05 Suma: dos rejillas con + -->
  <symbol id="i-suma" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="8" width="7" height="8" rx="1"/><rect x="14.5" y="8" width="7" height="8" rx="1"/><path d="M12 10.5v3M10.5 12h3"/></symbol>
  <!-- 06 Producto: fila 1x3 por columna 3x1 -->
